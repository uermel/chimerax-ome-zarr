[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]

[project]
name = "ChimeraX-OME-Zarr"
version = "1.0.0-alpha"
dynamic = ["classifiers", "requires-python"]
dependencies = [
    "ChimeraX-Core>=1.7",
    "ChimeraX-Segmentations",
    "zarr>=3.0.10,<3.1",
    "fsspec>=2024.12.0",
    "s3fs>=2024.12.0",
    "smbprotocol",
]
authors = [
  {name = "Utz H. Ermel", email = "utz@ermel.me"},
]
description = "Open OME-Zarr files in ChimeraX."
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["ome-zarr", "bioimaging", "ngff", "ome", "zarr", "multiscale"]

[project.urls]
Repository = "https://github.com/uermel/chimerax-ome-zarr.git"
Issues = "https://github.com/uermel/chimerax-ome-zarr/issues"

[project.optional-dependencies]
dev = [
    "black",
    "pre-commit",
    "pytest",
    "pytest-rerunfailures",
    "ruff",
]

[chimerax]
categories = ["Volume Data"]
module-name-override = "ome_zarr"
package = "chimerax.ome-zarr"
min-session-version="1"
max-session-version="1"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License"
]

[chimerax.data-format."OME-Zarr"]
category = "Volume Data"
nicknames = ["ome-zarr", "omezarr"]
suffixes = [".zarr"]
reference-url="https://ngff.openmicroscopy.org/latest/"
synopsis="Next-generation file format (NGFF) specifications for storing bioimaging data in the cloud."

[[chimerax.data-format."OME-Zarr".open]]
want-path = true
check-path = false
is-default = true
type = "open"

[[chimerax.data-format."OME-Zarr".open]]
name = "ngff"
type = "fetch"

[chimerax.package-data]
"src/docs/user/" = ["*.html"]
"src/docs/user/commands/" = ["*.html"]


[tool.black]
line-length = 120
target_version = ['py311']

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",  # pyflakes
    "B",  # bugbear
    "I",  # isort
    "N",  # pep8-naming
    "ASYNC",  # async
    "COM",  # commas
    "C4",  # comprehensions
    "DTZ",  # datetimez
    "ISC",  # implicit-str-concat
    "G",  # logging-format
    "T20",  # print
    "SIM",  # simplify
]
ignore = [
    "N815",  # Variable in class scope should not be mixedCase
    "N802",  # Function name should be lowercase
    "N999",  # Invalid module name
    "E501",  # line too long
    "C408",  # rewrite empty built-ins as literals
    "T201",  # print statements.
    "DTZ007", # Datetime objects without timezones.
    "DTZ005", # More datetimes without timezones.
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
testpaths = ["tests"]
markers = [
    "chimerax: requires a full UCSF ChimeraX installation",
    "remote: accesses a live OME-Zarr store over HTTPS",
    "upstream: consumes a pinned upstream OME-NGFF fixture suite",
]

[tool.mypy]
show_error_codes = true
ignore_missing_imports = true
warn_unreachable = true
strict = true
